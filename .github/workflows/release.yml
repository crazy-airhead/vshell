name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails 3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build macOS app bundle
        run: chmod +x scripts/build_macos.sh && ./scripts/build_macos.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vshell-macos
          path: bin/vshell.app

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails 3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build Windows binary
        run: wails3 task windows:build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vshell-windows
          path: bin/vshell.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: vshell-macos
          path: ./artifacts/vshell.app

      - uses: actions/download-artifact@v4
        with:
          name: vshell-windows
          path: ./artifacts/

      - name: Package macOS app
        run: |
          cd artifacts
          zip -r vshell-macos.zip vshell.app

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/vshell-macos.zip
            artifacts/vshell.exe
