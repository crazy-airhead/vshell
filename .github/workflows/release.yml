name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails 3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build macOS DMG
        run: chmod +x scripts/build_macos.sh && ARCH=${{ matrix.arch }} ./scripts/build_macos.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vshell-macos-${{ matrix.arch }}
          path: bin/vshell-${{ matrix.arch }}.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails 3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Add Go bin to PATH
        run: |
          $goBin = Join-Path (go env GOPATH) "bin"
          $goBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build Windows installer
        run: wails3 task windows:package ARCH=amd64 FORMAT=nsis

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vshell-windows
          path: bin/vshell-amd64-installer.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: vshell-macos-*
          path: ./artifacts/
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: vshell-windows
          path: ./artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/vshell-arm64.dmg
            artifacts/vshell-amd64.dmg
            artifacts/vshell-amd64-installer.exe
